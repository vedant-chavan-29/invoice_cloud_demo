# Kubernetes blueprint for the Invoice Cloud Demo
apiVersion: apps/v1
kind: Deployment
metadata:
  name: invoice-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: invoice-app
  template:
    metadata:
      labels:
        app: invoice-app
    spec:
      containers:
        - name: invoice-app
          image: vedantkc/invoice-app:v1
          ports:
            - containerPort: 5000
          env:
            - name: S3_BUCKET
              value: "icem-invoice-demo-vedant"
            - name: AWS_REGION
              value: "ap-south-1"
            - name: APP_VERSION
              value: "v1"
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
          volumeMounts:
            - name: invoice-folder
              mountPath: /app/invoice
      volumes:
        - name: invoice-folder
          hostPath:
            path: /home/ubuntu/invoice
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: invoice-app
spec:
  type: NodePort
  selector:
    app: invoice-app
  ports:
    - port: 80
      targetPort: 5000
      nodePort: 30080
